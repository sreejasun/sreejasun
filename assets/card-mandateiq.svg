<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="MandateIQ: multi-agent LLM system · fund review · my current project">
<title>MandateIQ — multi-agent LLM system · fund review · my current project</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B0E"/><stop offset="1" stop-color="#16111b"/></linearGradient>
