<text x="28" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#c9c9d1">Evidence-first adversarial review of fund</text>
<text x="28" y="124" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#c9c9d1">nominations. Two agents argue; rules and a</text>
<text x="28" y="144" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#c9c9d1">Trust Score decide what happens next.</text>

