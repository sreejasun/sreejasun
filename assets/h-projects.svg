<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="Projects">
<style>.t{fill:#17171c}.l{stroke:#17171c;stroke-opacity:.14}@media (prefers-color-scheme:dark){.t{fill:#f4f4f7}.l{stroke:#fff;stroke-opacity:.14}}</style>
<text x="0" y="40" font-family="SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#E8A0B8">03<animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></text>
